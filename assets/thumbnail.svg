<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">hoplite2api</title>
  <desc id="desc">Hoplite models connect to local OMP tools through a loopback proxy and Hoplite ACP in the cloud. Tool callbacks return to OMP for local execution.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="var(--fg, #767676)">
    <text x="70" y="137" font-size="76" font-weight="700" letter-spacing="-2">hoplite2api</text>
    <text x="73" y="187" font-size="28" font-weight="400">Hoplite models. Local OMP tools.</text>
  </g>

  <path d="M70 245H930" fill="none" stroke="var(--border, #767676)" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="var(--fg, #767676)">
    <text x="70" y="314" font-size="25" font-weight="650">OMP</text>
    <text x="70" y="342" font-size="17" fill="var(--muted, #767676)">local</text>
    <text x="397" y="314" font-size="25" font-weight="650">proxy</text>
    <text x="397" y="342" font-size="17" fill="var(--muted, #767676)">loopback</text>
    <text x="716" y="314" font-size="25" font-weight="650">Hoplite ACP</text>
    <text x="716" y="342" font-size="17" fill="var(--muted, #767676)">cloud</text>
  </g>

  <g fill="none" stroke="var(--accent, #767676)" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M187 306H345 M194 300L187 306L194 312 M338 300L345 306L338 312"/>
    <path d="M526 306H664 M533 300L526 306L533 312 M657 300L664 306L657 312"/>
    <path d="M858 373V428H76 M83 422L76 428L83 434"/>
  </g>
  <text x="397" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="var(--muted, #767676)">Tool callback · executes in OMP</text>
</svg>
